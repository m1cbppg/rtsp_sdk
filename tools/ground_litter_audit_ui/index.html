<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地面垃圾候选审核</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><h1>地面垃圾候选审核</h1><p id="dataset"></p></div><div class="progress"><b id="progress">0 / 0</b><span id="saved">读取中</span></div></header>
<main><aside><div class="filters"><button data-filter="all">全部</button><button data-filter="todo" class="active">未审核</button><button data-filter="LITTER">垃圾</button></div><div id="queue"></div></aside>
<section><div class="meta"><span id="position"></span><span id="source"></span><span id="time"></span></div><div class="images"><figure><img id="context"><figcaption>红框位置与环境</figcaption></figure><figure><img id="crop"><figcaption>候选局部</figcaption></figure></div><details><summary>查看前后帧</summary><div class="evidence"><figure><img id="before"><figcaption>前 2 秒</figcaption></figure><figure><img id="after"><figcaption>后 2 秒</figcaption></figure></div></details><div class="actions"><button class="litter" data-label="LITTER"><kbd>1</kbd> 是垃圾</button><button data-label="NON_LITTER"><kbd>2</kbd> 不是垃圾</button><button data-label="BOX_WRONG"><kbd>3</kbd> 框错了/看不清目标</button><button data-label="UNCERTAIN"><kbd>4</kbd> 无法判断</button></div><textarea id="note" placeholder="可选备注，例如：纸片、塑料瓶、反光、摊位物品"></textarea><div class="nav"><button id="prev">← 上一个</button><button id="next">下一个 →</button></div></section></main><script src="app.js"></script></body></html>
