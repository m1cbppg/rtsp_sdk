<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 1C-1R · Truth 复核收口</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="title">
    <h1>Step 1C-1R · Truth Reconciliation</h1>
    <p id="meta" class="muted">读取中…</p>
  </div>
  <div class="progress">
    <b id="progress">0 / 0</b>
    <span id="status-line" class="muted">读取中</span>
  </div>
</header>

<main>
  <aside>
    <div class="filters">
      <label>状态
        <select id="f-status">
          <option value="pending">未复核</option>
          <option value="all">全部</option>
          <option value="decided">已复核</option>
          <option value="KEEP_REQUIRED">KEEP_REQUIRED</option>
          <option value="IGNORE_SMALL">IGNORE_SMALL</option>
          <option value="NON_LITTER">NON_LITTER</option>
          <option value="UNCERTAIN">UNCERTAIN</option>
          <option value="IDENTITY_AMBIGUOUS">IDENTITY_AMBIGUOUS</option>
        </select>
      </label>
      <label>摄像头
        <select id="f-camera"><option value="all">全部</option></select>
      </label>
      <label>来源
        <select id="f-origin">
          <option value="all">全部</option>
          <option value="historical_litter">historical_litter</option>
          <option value="box_wrong">box_wrong</option>
          <option value="manual_missing_target">manual_missing_target</option>
          <option value="split_derived">split_derived</option>
        </select>
      </label>
      <label>搜索 episode_id
        <input id="f-search" type="search" placeholder="ge-…">
      </label>
    </div>
    <div id="queue" class="queue"></div>
  </aside>

  <section>
    <div id="detail" class="detail">
      <p class="muted">选择左侧 episode 开始复核（仅 60 条 TRUTH_REVIEW_REQUIRED）</p>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
