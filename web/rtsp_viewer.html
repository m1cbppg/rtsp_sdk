<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTSP 大屏</title>
<style>
  :root{
    --bg:#0b0f18; --panel:#141a28; --line:#24304a; --panel2:#1b2335;
    --txt:#dbe4f5; --dim:#7d8db3; --acc:#3d8bff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 20% -10%,#16203a 0%,var(--bg) 55%);
    color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;
    overflow:hidden}
  main{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;padding:14px;height:100vh}
  @media (max-width:900px){main{grid-template-columns:1fr;overflow:auto;height:auto}}
  .col{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
  .bar{display:flex;align-items:center;gap:8px;padding:0 2px}
  .bar h2{font-size:12px;margin:0;color:var(--dim);font-weight:600;letter-spacing:.6px}
  .bar .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .bar .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:5px 12px;
    border-radius:7px;cursor:pointer;font-size:12px;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  textarea,input,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:7px;padding:4px 8px;font-size:12px}
  textarea{width:100%;min-height:56px;font-family:ui-monospace,Consolas,monospace;padding:7px 9px}
  .port{width:64px}

  /* 大屏 2x2 网格：铺满左侧，格子按可用空间等分，视频 cover 填充（不拉伸）；不足 4 路只占上排 */
  .wallbox{flex:1;min-height:0;display:flex}
  .wall{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(2,1fr);gap:12px}
  .cell{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:#000;box-shadow:0 6px 24px rgba(0,0,0,.35);min-width:0;min-height:0;display:flex}
  .cell video{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;background:#000}
  .cell .ops{position:absolute;bottom:8px;right:8px;z-index:2;opacity:0;transition:opacity .15s}
  .cell:hover .ops{opacity:1}
  .cell .ops .btn{padding:3px 9px;font-size:11px;background:rgba(10,14,24,.6)}
  .cell .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:#e6ecfb;font-size:12px;background:rgba(10,14,24,.6);z-index:3;pointer-events:none}
  .cell .msg.on{display:flex}

  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;
    overflow-y:auto;flex:1;min-height:0;align-content:start;padding-right:4px}
  .imgs::-webkit-scrollbar{width:8px}
  .imgs::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  img.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;border:1px solid var(--line);
    cursor:pointer;background:#000;display:block;transition:transform .15s,border-color .15s}
  img.thumb:hover{border-color:var(--acc);transform:scale(.99)}
  .itag{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .itag span{font-size:10px;color:var(--dim);border:1px solid var(--line);padding:0 5px;border-radius:4px}

  .gear{position:fixed;top:12px;right:12px;z-index:60;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:15px;transition:border-color .15s}
  .gear:hover{border-color:var(--acc)}
  .cfg{position:fixed;top:54px;right:12px;z-index:60;width:340px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.55)}
  .cfg.open{display:block}
  .cfg .row{display:flex;gap:8px;align-items:center;margin-top:9px}
  .cfg .row label{font-size:11px;color:var(--dim)}
  .cfg .row .spacer{flex:1}
  .empty{color:var(--dim);text-align:center;padding:40px 0;font-size:12px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;
    justify-content:center;z-index:80;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:94vw;max-height:92vh;border-radius:10px}
</style>
</head>
<body>

<button class="gear" id="gear" title="设置">⚙</button>
<div class="cfg" id="cfg">
  <textarea id="urls" placeholder="每行一个 rtsp:// 地址；可选 名称|地址"></textarea>
  <div class="row"><label>HLS端口</label><input class="port" id="hlsPort" type="number" value="38088">
    <span class="spacer"></span><button class="btn primary" id="btn_add">应用</button>
    <button class="btn" id="btn_clear">清空</button></div>
</div>

<main>
  <section class="col">
    <div class="bar"><span class="dot"></span><h2>直播</h2><span class="spacer"></span></div>
    <div class="wallbox" id="wallbox"><div class="wall" id="wall"></div></div>
  </section>

  <section class="col">
    <div class="bar"><span class="dot" style="background:#e0a24a;box-shadow:0 0 8px #e0a24a"></span><h2>图片</h2><span class="spacer"></span>
      <select id="img_filter">
        <option value="">全部</option>
        <option value="boat_confirmed">确认</option>
        <option value="candidate_not_confirmed">未确认</option>
      </select>
      <button class="btn" id="btn_imgs">刷新</button>
    </div>
    <div class="imgs" id="imgs"></div>
  </section>
</main>

<div class="lightbox" id="lightbox"><img id="lightbox_img" alt=""></div>

<script>
"use strict";
const LS_URLS="rtspViewer.urls", LS_PORT="rtspViewer.hlsPort";
const HLS_JS_LOCAL="/hls.min.js", HLS_JS_CDN="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js";
// 长时稳定配置：backBufferLength 限制后退缓冲，防止长时间播放内存无限增长
const HLS_CFG={enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,backBufferLength:30,lowLatencyMode:false};
const IMG_LIMIT=120;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=s=>encodeURIComponent(s);
const isSafari=()=>/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const cards=[];

function parseRtsp(url){
  try{const u=new URL(url); if(u.protocol!=="rtsp:")return null;
    return{raw:url,host:u.hostname,path:u.pathname,
      id:(u.pathname.match(/\/detected\/([^\/]+)/)||[])[1]||u.hostname+u.pathname};}
  catch(e){return null;}
}

function loadScript(src){return new Promise(r=>{const s=document.createElement("script");s.src=src;
  s.onload=()=>r(!!window.Hls);s.onerror=()=>r(false);document.head.appendChild(s);});}
async function ensureHlsJs(){
  if(window.Hls)return true;
  if(await loadScript(HLS_JS_LOCAL))return true;   // 本地优先，上墙不依赖外网
  return loadScript(HLS_JS_CDN);
}

async function playCard(card){
  const v=card.video;
  clearTimeout(card.retryTimer);
  if(card.hls){try{card.hls.destroy();}catch(e){}card.hls=null;}
  v.pause();v.removeAttribute("src");v.load();
  card.show("");
  const port=parseInt($("hlsPort").value,10)||38088;
  const hlsUrl="http://"+card.src.host+":"+port+card.src.path+"/index.m3u8";
  try{
    if(!isSafari()&&await ensureHlsJs()){
      const hls=new Hls(HLS_CFG);
      card.hls=hls;hls.loadSource(hlsUrl);hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{card.errored=false;card.retryCount=0;clearTimeout(card.retryTimer);v.play().catch(()=>{});});
      hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){try{hls.destroy();}catch(err){}card.hls=null;scheduleRetry(card);}});
    }else{v.src=hlsUrl;v.play().catch(()=>{scheduleRetry(card);});}
  }catch(e){scheduleRetry(card);}
}
// 指数退避重连（5s→10s→20s→30s封顶），避免死流时高频重建 Hls 实例
function scheduleRetry(card){
  const n=(card.retryCount||0)+1;card.retryCount=n;
  const delay=Math.min(30000,5000*Math.pow(2,n-1));
  card.errored=true;card.show("重连("+Math.round(delay/1000)+"s)");
  clearTimeout(card.retryTimer);card.retryTimer=setTimeout(()=>playCard(card),delay);
}
function stopCard(card){
  clearTimeout(card.retryTimer);card.retryTimer=null;
  if(card.hls){try{card.hls.destroy();}catch(e){}card.hls=null;}
  card.video.pause();card.video.removeAttribute("src");card.video.load();
  card.errored=false;
}

function buildWall(){
  for(const c of cards) stopCard(c);   // 先销毁旧的，防止 Hls/worker 泄漏
  cards.length=0;
  const wall=$("wall");wall.innerHTML="";
  const lines=$("urls").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!lines.length){wall.innerHTML='<div class="empty">点击右上角 ⚙ 添加直播流</div>';return;}
  const parsed=[];
  for(const line of lines){
    const i=line.indexOf("|");const url=i>0?line.slice(i+1).trim():line;
    const src=parseRtsp(url);if(src)parsed.push(src);
  }
  for(const src of parsed.slice(0,4)){   // 上墙取前4路，铺满 2x2
    const cell=document.createElement("div");cell.className="cell";
    cell.innerHTML=`<video autoplay muted playsinline></video>
      <div class="msg"></div>
      <div class="ops"><button class="btn act-full">全屏</button><button class="btn act-copy">复制RTSP</button></div>`;
    const card={src,video:cell.querySelector("video"),msgEl:cell.querySelector(".msg"),cell,hls:null,
      errored:false,retryCount:0,retryTimer:null};
    card.show = t => { card.msgEl.textContent = t || ""; card.msgEl.classList.toggle("on", !!t); };
    cell.querySelector(".act-full").onclick=e=>{e.stopPropagation();fullscreen(card.video);};
    cell.querySelector(".act-copy").onclick=async()=>{try{await navigator.clipboard.writeText(src.raw);}catch(e){}};
    card.video.onclick=()=>fullscreen(card.video);
    wall.appendChild(cell);cards.push(card);playCard(card);
  }
}
function fullscreen(el){
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!fn)return;
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else{fn.call(el);}
  }catch(e){}
}
// 页面卸载/后台时释放与降负
window.addEventListener("beforeunload",()=>{for(const c of cards) stopCard(c);});
document.addEventListener("visibilitychange",()=>{
  const hidden=document.hidden;
  for(const c of cards){ if(hidden){c.video.pause();} else {c.video.play().catch(()=>{});} }
});

async function loadImgs(){
  const box=$("imgs");box.innerHTML='<div class="empty">加载中…</div>';
  const f=$("img_filter").value;
  const q=(f?"result="+enc(f)+"&":"")+"limit="+IMG_LIMIT;
  try{
    const r=await fetch("/v1/vessel-verifications?"+q);
    if(!r.ok){box.innerHTML='<div class="empty">加载失败 '+r.status+'</div>';return;}
    const jobs=await r.json();const items=[];
    for(const j of jobs)for(const im of (j.images||[]))items.push({j,im});
    if(!items.length){box.innerHTML='<div class="empty">无图片</div>';return;}
    box.innerHTML="";
    for(const it of items){
      const d=document.createElement("div");
      d.innerHTML=`<img class="thumb" loading="lazy" src="${esc(it.im.download_url)}" alt="">
        <div class="itag"><span>${esc(it.j.result||"")}</span><span>${esc((it.j.stream_id||"").slice(0,8))}</span></div>`;
      d.querySelector("img").onclick=()=>openLightbox(it.im.download_url);
      box.appendChild(d);
    }
  }catch(e){box.innerHTML='<div class="empty">出错</div>';}
}

function openLightbox(src){$("lightbox_img").src=src;$("lightbox").classList.add("open");}
function closeLightbox(){$("lightbox").classList.remove("open");$("lightbox_img").src="";}
$("lightbox").onclick=closeLightbox;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox();});

$("gear").onclick=()=>$("cfg").classList.toggle("open");
let timer=null;
$("urls").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(LS_URLS,$("urls").value);buildWall();},400);});
$("btn_add").onclick=()=>{localStorage.setItem(LS_URLS,$("urls").value);buildWall();$("cfg").classList.remove("open");};
$("btn_clear").onclick=()=>{$("urls").value="";localStorage.setItem(LS_URLS,"");buildWall();};
$("btn_imgs").onclick=loadImgs;
$("img_filter").onchange=loadImgs;
$("hlsPort").addEventListener("change",()=>{localStorage.setItem(LS_PORT,$("hlsPort").value);buildWall();});
$("urls").value=localStorage.getItem(LS_URLS)||"";
$("hlsPort").value=localStorage.getItem(LS_PORT)||"38088";
buildWall();
loadImgs();
</script>
</body>
</html>
